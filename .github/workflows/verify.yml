# Runs the single verification entry point, ./scripts/verify.sh, exactly as Claude and the Stop
# hook run it locally. CI runs the release tier: fast checks, real-media integration tests (FFmpeg
# renders with decoded-output oracles) and the verification tooling suites on every installed awk.
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ./scripts/verify.sh --tier release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Toolchain: FFmpeg 6.1 and the awk implementations the checker suite covers come from the
      # Ubuntu 24.04 archive; uv (pinned to the version in docs/ENVIRONMENT_CAPABILITIES.md)
      # installs Python 3.11 and the locked backend environment. verify.sh only checks.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mawk gawk original-awk busybox

      - name: Install uv and the locked backend environment
        run: |
          pipx install uv==0.8.17
          uv sync --frozen --directory backend

      - name: Run ./scripts/verify.sh --tier release
        run: ./scripts/verify.sh --tier release
