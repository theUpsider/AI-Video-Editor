[project]
name = "ave"
version = "0.1.0"
description = "AI Video Editor backend: exact timing model, media probing, synchronization and CPU reference renderer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "media: integration tests that generate fixtures and run real FFmpeg/FFprobe (slow; decoded-output oracles)",
    "slow: seeded population and property tests over many synthetic signals (media tier)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "N", "S", "PTH", "RET", "PIE",
]
ignore = [
    # Every subprocess call goes through ave.proc.run_tool with an argv list, an absolute tool path,
    # shell=False and a timeout; untrusted values are passed only as separate argv items.
    "S603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests compare exact Fractions with int literals (numerically exact in Python).
module = ["tests.*"]
disable_error_code = ["comparison-overlap"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
